name: Daily reel

# Every morning: Claude writes the reel, it's voiced and rendered, the history is committed,
# and the MP4 is published on GitHub Pages for Buffer to fetch.
on:
  schedule:
    - cron: '30 0 * * *' # 06:00 in India
  workflow_dispatch:
    inputs:
      date:
        description: Date (YYYY-MM-DD); empty means today in India
        required: false
      test:
        description: Mark it as a test in the history
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      date: ${{ steps.daily.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en_US-ryan-high-v1

      - name: Install Piper
        run: |
          python -m venv .venv
          .venv/bin/pip install -q piper-tts
          [ -f voices/en_US-ryan-high.onnx ] || .venv/bin/python -m piper.download_voices --download-dir voices en_US-ryan-high

      - name: Install packages
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          npm install -g @anthropic-ai/claude-code

      - name: Write, voice and render
        id: daily
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/daily.ts ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ inputs.test && '--test' || '' }}

      - name: Keep the video as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.daily.outputs.date }}
          path: |
            out/${{ steps.daily.outputs.date }}.mp4
            reels/${{ steps.daily.outputs.date }}.json
          retention-days: 30

      - name: Commit the reel and history
        run: |
          git config user.name randomtalker-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reels/ data/history.json
          git commit -qm "reel: ${{ steps.daily.outputs.date }}" || echo "nothing to commit"
          git pull -q --rebase origin main && git push -q origin HEAD:main

      - name: Add the video to the media branch
        run: scripts/media.sh "${{ steps.daily.outputs.date }}" "out/${{ steps.daily.outputs.date }}.mp4" "reels/${{ steps.daily.outputs.date }}.json"

  publish:
    needs: make
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}${{ needs.make.outputs.date }}.mp4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Check the video is reachable
        run: |
          url="${{ steps.deploy.outputs.page_url }}${{ needs.make.outputs.date }}.mp4"
          for i in $(seq 1 20); do
            read -r code type < <(curl -s -o /dev/null -w '%{http_code} %{content_type}\n' "$url")
            echo "$code $type"
            if [ "$code" = 200 ] && [[ "$type" == video/mp4* ]]; then echo "ok: $url"; exit 0; fi
            sleep 15
          done
          echo "::error::$url is not serving video/mp4"; exit 1

  report-failure:
    needs: [make, publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Daily reel failed: $(date -u +%F)" \
            --body "The daily reel run failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
